name: Keep bc-api warm

# Pings the Bloodchain API every 10 minutes so Render's free tier
# doesn't spin it down. Also runnable manually from the Actions tab
# right before a demo.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" https://bc-api.onrender.com/health || echo "000")
            echo "Attempt $i — HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/body
              exit 0
            fi
            sleep 20
          done
          echo "bc-api did not respond with 200 after 5 attempts"
          cat /tmp/body || true
          exit 1
